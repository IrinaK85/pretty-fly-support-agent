<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretty Fly Support Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-links {
            display: flex;
            gap: 20px;
        }

        .header-link {
            color: white;
            text-decoration: none;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .header-link:hover {
            opacity: 1;
        }

        .container {
            display: flex;
            height: calc(100vh - 60px);
            margin-top: 60px;
        }

        .sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
            color: #667eea;
        }

        .ticket-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .ticket-item:hover {
            background: #f8f8f8;
        }

        .ticket-item.active {
            background: #f0f4ff;
            border-left: 3px solid #667eea;
            padding-left: 17px;
        }

        .ticket-item-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .ticket-item-subject {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .ticket-item-ltv {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            align-items: center;
        }

        .ltv-badge {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }

        .ltv-badge.high {
            background: #d4edda;
            color: #155724;
        }

        .ltv-badge.medium {
            background: #fff3cd;
            color: #856404;
        }

        .ltv-badge.low {
            background: #f8d7da;
            color: #721c24;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .ticket-header {
            padding: 25px;
            border-bottom: 1px solid #e0e0e0;
            background: #f9f9f9;
        }

        .ticket-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .customer-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .info-item {
            background: white;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            font-size: 13px;
        }

        .info-label {
            color: #999;
            margin-bottom: 5px;
            font-size: 11px;
        }

        .info-value {
            font-weight: 600;
            color: #333;
        }

        .ltv-value {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tier-indicator {
            font-size: 16px;
        }

        .conversation {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: white;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.customer {
            align-items: flex-end;
        }

        .message.agent {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.customer .message-bubble {
            background: #667eea;
            color: white;
            border-radius: 12px 12px 0 12px;
        }

        .message.agent .message-bubble {
            background: #f0f0f0;
            color: #333;
            border-radius: 12px 12px 12px 0;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: white;
        }

        .suggested-messages {
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .suggested-btn {
            background: white;
            border: 1px solid #e0e0e0;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: #667eea;
            transition: all 0.2s;
        }

        .suggested-btn:hover {
            background: #f0f4ff;
            border-color: #667eea;
        }

        .message-input-area {
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }

        .message-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #5568d3;
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎀 Pretty Fly Support</h1>
        <div class="header-links">
            <a href="/" class="header-link">Conversations</a>
            <a href="/metrics" class="header-link">📊 Metrics</a>
            <a href="/marketing" class="header-link">📈 Marketing</a>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">Support Tickets</div>
            <div id="ticketsList"></div>
        </div>

        <div class="main">
            <div id="ticketView"></div>
        </div>
    </div>

    <script>
        let currentTicketId = null;

        async function loadTickets() {
            try {
                const response = await fetch('/api/tickets');
                const tickets = await response.json();

                const ticketsList = document.getElementById('ticketsList');
                ticketsList.innerHTML = tickets.map(ticket => `
                    <div class="ticket-item" onclick="selectTicket('${ticket.ticket_id}', this)">
                        <div class="ticket-item-name">${ticket.customer_name}</div>
                        <div class="ticket-item-subject">${ticket.subject}</div>
                        <div class="ticket-item-ltv">
                            <span>£${ticket.ltv.toFixed(0)}</span>
                            <span class="ltv-badge ${ticket.ltv_tier}">${ticket.ltv_color}</span>
                        </div>
                    </div>
                `).join('');

                if (tickets.length > 0) {
                    selectTicket(tickets[0].ticket_id, ticketsList.firstChild);
                }
            } catch (error) {
                console.error('Error loading tickets:', error);
            }
        }

        async function selectTicket(ticketId, element) {
            currentTicketId = ticketId;
            document.querySelectorAll('.ticket-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            await loadTicketDetail(ticketId);
        }

        async function loadTicketDetail(ticketId) {
            try {
                const response = await fetch(`/api/ticket/${ticketId}`);
                const ticket = await response.json();

                const tierColor = {
                    'high': '🟢 High-Value',
                    'medium': '🟡 Medium-Value',
                    'low': '🔴 Low-Value'
                };

                const ticketView = document.getElementById('ticketView');
                ticketView.innerHTML = `
                    <div class="ticket-header">
                        <div class="ticket-title">${ticket.subject}</div>
                        <div class="customer-info">
                            <div class="info-item">
                                <div class="info-label">Customer</div>
                                <div class="info-value">${ticket.customer_name}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Lifetime Value</div>
                                <div class="info-value ltv-value">
                                    <span class="tier-indicator">${ticket.customer_ltv_color}</span>
                                    <span>£${ticket.customer_ltv.toFixed(0)}</span>
                                </div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Customer Tier</div>
                                <div class="info-value">${tierColor[ticket.customer_ltv_tier]}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Orders</div>
                                <div class="info-value">${ticket.customer_order_count}</div>
                            </div>
                        </div>
                    </div>

                    <div class="conversation" id="conversation">
                        ${ticket.conversation.length === 0 ?
                            `<div class="empty-state">Start the conversation...</div>` :
                            ticket.conversation.map(msg => `
                                <div class="message ${msg.role}">
                                    <div class="message-bubble">${msg.content}</div>
                                    <div class="message-time">${new Date(msg.timestamp).toLocaleTimeString()}</div>
                                </div>
                            `).join('')
                        }
                    </div>

                    <div class="input-area">
                        <div class="suggested-messages">
                            ${ticket.suggested_responses.map(response => `
                                <button class="suggested-btn" onclick="sendSuggestedMessage('${response.replace(/'/g, "\\'")}')">${response}</button>
                            `).join('')}
                        </div>
                        <div class="message-input-area">
                            <textarea class="message-input" id="messageInput" placeholder="Type your message..." rows="2"></textarea>
                            <button class="send-btn" onclick="sendMessage()">Send</button>
                        </div>
                    </div>
                `;

                document.getElementById('messageInput').focus();
            } catch (error) {
                console.error('Error loading ticket:', error);
            }
        }

        async function sendSuggestedMessage(message) {
            document.getElementById('messageInput').value = message;
            await sendMessage();
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (!message || !currentTicketId) return;

            const conversation = document.getElementById('conversation');
            conversation.innerHTML += `
                <div class="message customer">
                    <div class="message-bubble">${message}</div>
                </div>
                <div class="loading">
                    <div class="spinner"></div> Processing...
                </div>
            `;
            conversation.scrollTop = conversation.scrollHeight;

            messageInput.value = '';

            try {
                const response = await fetch(`/api/ticket/${currentTicketId}/message`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const result = await response.json();

                conversation.querySelector('.loading').remove();

                conversation.innerHTML += `
                    <div class="message agent">
                        <div class="message-bubble">${result.bot_response}</div>
                    </div>
                `;

                const suggestedArea = document.querySelector('.suggested-messages');
                suggestedArea.innerHTML = result.suggested_responses.map(r => `
                    <button class="suggested-btn" onclick="sendSuggestedMessage('${r.replace(/'/g, "\\'")}')">${r}</button>
                `).join('');

                conversation.scrollTop = conversation.scrollHeight;
            } catch (error) {
                console.error('Error sending message:', error);
                const loadingDiv = conversation.querySelector('.loading');
                if (loadingDiv) {
                    loadingDiv.innerHTML = '❌ Error sending message. Try again.';
                }
            }
        }

        loadTickets();
    </script>
</body>
</html>
